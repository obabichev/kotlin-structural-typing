# Compiling the IntelliJ plugin against the full IDE classpath needs more memory than the defaults.
org.gradle.jvmargs=-Xmx4g
kotlin.daemon.jvmargs=-Xmx4g

# Kotlin compiler plugin DevKit: which compiler and IDE versions to build against.
kotlin.compiler.plugin.devkit.minCliVersion=2.4.20
kotlin.compiler.plugin.devkit.compilerPlugin=:structural-compiler-plugin
kotlin.compiler.plugin.devkit.companionLibraries=:structural-annotations
kotlin.compiler.plugin.devkit.minIdeaVersion=262
kotlin.compiler.plugin.devkit.includeIdeaRc=true
kotlin.compiler.plugin.devkit.includeIdeaEap=true
# 2.5.0-dev currently fails inside the DevKit's own test infrastructure (IrDiagnosticsHandler), so it stays off.
# kotlin.compiler.plugin.devkit.useLatestDev=true
